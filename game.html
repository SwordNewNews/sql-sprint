<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SQL 闯关 · 12 关打到笔试及格</title>
<style>
  :root{
    --bg:#0d0f14;--panel:#161a22;--panel2:#1d222c;--line:#2a3140;
    --fg:#e8ecf3;--muted:#8b93a3;--accent:#5b8cff;--accent2:#37d6a5;
    --warn:#ff9f5a;--bad:#ff6b6b;--gold:#ffd166;
    --code:#0a0c10;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--fg)}
  body{font:16px/1.7 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;min-height:100vh;background:
    radial-gradient(1100px 500px at 50% -10%,rgba(91,140,255,.16),transparent 60%),
    radial-gradient(800px 400px at 90% 110%,rgba(55,214,165,.10),transparent 60%),var(--bg)}
  .app{max-width:720px;margin:0 auto;padding:14px 14px 40px}
  /* ---------- HUD ---------- */
  .hud{position:sticky;top:0;z-index:20;backdrop-filter:blur(10px);background:rgba(13,15,20,.82);border-bottom:1px solid var(--line);margin:0 -14px 14px;padding:10px 14px}
  .hud .row{display:flex;align-items:center;gap:10px;justify-content:space-between}
  .lvl{font-size:13px;color:var(--muted);letter-spacing:.02em}
  .lvl b{color:var(--fg);font-size:14px}
  .stats{display:flex;gap:14px;align-items:center;font-variant-numeric:tabular-nums}
  .stat{display:flex;flex-direction:column;align-items:flex-end;line-height:1.2}
  .stat span{font-size:11px;color:var(--muted)}
  .stat strong{font-size:15px}
  #combo{color:var(--gold);opacity:0;transition:opacity .25s,transform .25s;transform:scale(.9)}
  #combo.on{opacity:1;transform:scale(1)}
  .progress{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:9px}
  .progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--accent2));transition:width .45s cubic-bezier(.2,.8,.2,1)}
  /* ---------- card ---------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;margin-bottom:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
  .card.teach{border-color:#31405e;background:linear-gradient(180deg,rgba(91,140,255,.09),transparent 55%),var(--panel)}
  .kicker{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);background:rgba(91,140,255,.12);border:1px solid rgba(91,140,255,.3);padding:3px 9px;border-radius:999px;margin-bottom:10px}
  .kicker.task{color:var(--accent2);background:rgba(55,214,165,.1);border-color:rgba(55,214,165,.3)}
  h2{font-size:19px;margin:0 0 8px;line-height:1.35}
  p{margin:8px 0}
  .small{font-size:13.5px;color:var(--muted)}
  code{background:var(--code);padding:1px 5px;border-radius:4px;font-family:ui-monospace,Consolas,monospace;font-size:13.5px;color:#a9c1ff}
  pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px;overflow-x:auto;font-family:ui-monospace,Consolas,monospace;font-size:13px;line-height:1.65;margin:10px 0}
  pre code{background:none;padding:0;color:#cfe0ff}
  .kw{color:#ff9f5a}.str{color:#7ee08a}.fn{color:#8ab4ff}.cm{color:#5f6b7f}
  /* ---------- buttons ---------- */
  button{font:inherit;cursor:pointer;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);padding:12px 16px;transition:transform .06s,background .2s,border-color .2s}
  button:active{transform:scale(.985)}
  button.primary{background:linear-gradient(135deg,var(--accent),#4570e6);border-color:transparent;font-weight:600;box-shadow:0 6px 18px rgba(91,140,255,.28)}
  button.ghost{background:transparent;color:var(--muted)}
  button:disabled{opacity:.45;cursor:default}
  .actions{display:flex;gap:10px;margin-top:14px}
  .actions button{flex:1}
  /* ---------- options ---------- */
  .opt{display:block;width:100%;text-align:left;margin:9px 0;padding:13px 14px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;font-size:14.5px;line-height:1.55}
  .opt code{font-size:13px}
  .opt.pick{border-color:var(--accent);background:rgba(91,140,255,.12)}
  .opt.right{border-color:var(--accent2);background:rgba(55,214,165,.14)}
  .opt.wrong{border-color:var(--bad);background:rgba(255,107,107,.12)}
  /* ---------- build ---------- */
  .tray{min-height:56px;border:1px dashed var(--line);border-radius:12px;padding:10px;display:flex;flex-wrap:wrap;gap:8px;background:var(--code);margin:10px 0}
  .tray.empty:before{content:"点下面的积木，按 SQL 顺序拼起来";color:var(--muted);font-size:13px}
  .tok{font-family:ui-monospace,Consolas,monospace;font-size:13px;padding:7px 10px;border-radius:8px;background:var(--panel2);border:1px solid var(--line);cursor:pointer}
  .tok.used{opacity:.25;pointer-events:none}
  .tray .tok{background:#22304a;border-color:#3d5a8f}
  .pool{display:flex;flex-wrap:wrap;gap:8px}
  /* ---------- order ---------- */
  .ord{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);margin:8px 0}
  .ord .n{width:22px;height:22px;flex:0 0 22px;border-radius:50%;background:#243049;color:#9db4e6;display:grid;place-items:center;font-size:12px}
  .ord .txt{flex:1;font-family:ui-monospace,Consolas,monospace;font-size:13px}
  .ord .mv{display:flex;gap:4px}
  .ord .mv button{padding:4px 9px;border-radius:7px;font-size:13px;background:#243049;border-color:#33425f}
  /* ---------- fill ---------- */
  input[type=text]{width:100%;font:inherit;font-family:ui-monospace,Consolas,monospace;font-size:16px;padding:14px;border-radius:12px;border:1px solid var(--line);background:var(--code);color:var(--fg)}
  input[type=text]:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(91,140,255,.15)}
  /* ---------- feedback ---------- */
  .fb{border-radius:12px;padding:13px 14px;margin-top:14px;font-size:14.5px;display:none}
  .fb.show{display:block;animation:pop .28s ease-out}
  .fb.ok{background:rgba(55,214,165,.1);border:1px solid rgba(55,214,165,.35)}
  .fb.no{background:rgba(255,107,107,.09);border:1px solid rgba(255,107,107,.35)}
  .fb b{display:block;margin-bottom:4px}
  @keyframes pop{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .toast{position:fixed;left:50%;top:72px;transform:translate(-50%,-12px);background:#1b2436;border:1px solid #3a4a6b;color:#dbe6ff;padding:9px 16px;border-radius:999px;font-size:14px;opacity:0;pointer-events:none;transition:.3s;z-index:50}
  .toast.on{opacity:1;transform:translate(-50%,0)}
  /* ---------- start / end ---------- */
  .hero{text-align:center;padding:28px 16px 10px}
  .hero h1{font-size:26px;margin:6px 0 10px;line-height:1.3}
  .hero .badge{font-size:12px;color:var(--gold);border:1px solid rgba(255,209,102,.35);background:rgba(255,209,102,.1);padding:4px 11px;border-radius:999px;display:inline-block}
  .big{font-size:40px;line-height:1;margin:10px 0}
  .end .rank{font-size:22px;font-weight:700;margin:6px 0}
  .review{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:8px 0;background:var(--panel2);font-size:14px}
  .review .t{color:var(--warn);font-size:13px}
  .spark{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
  .spark i{position:absolute;width:7px;height:7px;border-radius:2px;animation:fall 1.1s ease-out forwards}
  @keyframes fall{to{transform:translateY(70vh) rotate(320deg);opacity:0}}
  a{color:var(--accent)}

  /* --- 移动端基础修补（自动注入） --- */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }
  a,button,input,select,textarea,summary,[role="button"]{touch-action:manipulation}
  :focus-visible{outline:2px solid currentColor;outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <div class="hud" id="hud" style="display:none">
    <div class="row">
      <div class="lvl">第 <b id="lvlNo">1</b> / 12 关</div>
      <div class="stats">
        <div class="stat"><span>经验</span><strong id="xp">0</strong></div>
        <div class="stat"><span>连击</span><strong id="combo">×1</strong></div>
      </div>
    </div>
    <div class="progress"><i id="bar"></i></div>
  </div>
  <div id="stage"></div>
</div>
<div class="toast" id="toast"></div>
<div class="spark" id="spark"></div>

<script>
"use strict";

/* ============================ 关卡数据 ============================ */
// type: choice | build | fill | order
const LEVELS = [
  {
    teach: {
      t: "表和关系：订单里为什么没有客户名字",
      body: `<p>ERP 里，客户名字只存一次，放在 <code>Customer</code> 表；订单表只记一个 <code>CustomerId</code>。</p>
      <pre><code>Customer: Id | CustomerName | Phone
             1 | 甲公司        | 138...
             2 | 乙公司        | 139...

Orders:  Id | CustomerId | Amount
        101 |     1      | 1200
        102 |     2      | 5600</code></pre>
      <p class="small">要显示「甲公司买了 1200」，就得拿 <code>CustomerId</code> 回客户表里对名字——这就是后面所有 JOIN 的由来。</p>`
    },
    task: {
      type: "choice",
      q: "订单表里只存了 CustomerId，要显示客户名字，必须怎么做？",
      opts: [
        "用 CustomerId 去 Customer 表里把名字「对」回来（JOIN）",
        "订单表里直接加一列客户名字",
        "把两张表的数据复制到一张新表里"
      ],
      a: 0,
      why: "关系型数据库的原则是「数据只存一份」。客户改名字时只改 Customer 一处，订单自动跟着变——所以查询时用 JOIN 把两张表连起来。"
    }
  },
  {
    teach: {
      t: "一条查询的四个部分",
      body: `<p>任何查询都在回答四个问题：</p>
      <pre><code><span class="kw">SELECT</span>  要哪几列
<span class="kw">FROM</span>    哪张表
<span class="kw">WHERE</span>   只要哪些行
<span class="kw">ORDER BY</span> 怎么排序</code></pre>
      <p class="small">写作顺序就是 <code>SELECT → FROM → WHERE → ORDER BY</code>，照这个顺序落笔不会漏。</p>`
    },
    task: {
      type: "build",
      q: "拼一条查询：从 Orders 表里，查出金额大于 1000 的订单号，按金额从高到低。",
      tokens: ["SELECT", "OrderNo", "FROM", "Orders", "WHERE", "Amount > 1000", "ORDER BY", "Amount DESC", "GROUP BY"],
      answer: ["SELECT", "OrderNo", "FROM", "Orders", "WHERE", "Amount > 1000", "ORDER BY", "Amount DESC"],
      why: "这题用不到 GROUP BY——分组只在需要「合计/计数」时才出现。多出来的积木是干扰项。"
    }
  },
  {
    teach: {
      t: "空值：最容易丢分的一行",
      body: `<p>表里没填的值叫 <code>NULL</code>，它不是 0，也不是空字符串，而是「不知道」。</p>
      <pre><code><span class="cm">-- 错：永远查不到东西</span>
<span class="kw">WHERE</span> Amount = <span class="kw">NULL</span>

<span class="cm">-- 对：判断空值有专门写法</span>
<span class="kw">WHERE</span> Amount <span class="kw">IS NULL</span></code></pre>
      <p class="small">原因：<code>NULL = NULL</code> 的结果是「未知」，不是真。所以只能用 <code>IS NULL</code>。</p>`
    },
    task: {
      type: "fill",
      q: "把下面这条查询的空值判断补全（只填 WHERE 后面的部分）：查出金额为空的订单。",
      tpl: "SELECT OrderNo FROM Orders WHERE Amount ___",
      accept: ["is null", "amount is null", "is null;"],
      hint: "填两个英文单词，形如 XXX XXX",
      why: "标准答案 <code>IS NULL</code>。反义是 <code>IS NOT NULL</code>。写 <code>= NULL</code> 直接零分。"
    }
  },
  {
    teach: {
      t: "连接两张表：JOIN 的核心是 ON",
      body: `<p><code>ON</code> 后面写的是「两张表怎么对上」——这里就是 <code>Customer.Id = Orders.CustomerId</code>。</p>
      <pre><code><span class="kw">SELECT</span> o.OrderNo, c.CustomerName
<span class="kw">FROM</span> Orders o
<span class="kw">JOIN</span> Customer c
  <span class="kw">ON</span> c.Id = o.CustomerId</code></pre>
      <p class="small"><code>o</code>、<code>c</code> 是别名。两张表都有 <code>Id</code>，不起别名就分不清谁是谁。</p>`
    },
    task: {
      type: "build",
      q: "拼一条查询：显示订单号和客户名字，把 Orders 和 Customer 连起来。",
      tokens: ["SELECT", "o.OrderNo, c.CustomerName", "FROM", "Orders o", "JOIN", "Customer c", "ON", "c.Id = o.CustomerId", "WHERE"],
      answer: ["SELECT", "o.OrderNo, c.CustomerName", "FROM", "Orders o", "JOIN", "Customer c", "ON", "c.Id = o.CustomerId"],
      why: "顺序固定为 <code>表 别名 → JOIN 表 别名 → ON 连接条件</code>。多表就一路叠下去。"
    }
  },
  {
    teach: {
      t: "LEFT JOIN 还是 JOIN？一个词判断",
      body: `<p>题目里出现<strong>「所有」「没有下过单的」「含没有明细的」</strong>——一律 <code>LEFT JOIN</code>。</p>
      <pre><code><span class="cm">-- 所有客户 + 他们的订单（没下单的也出现）</span>
<span class="kw">FROM</span> Customer c
<span class="kw">LEFT JOIN</span> Orders o <span class="kw">ON</span> o.CustomerId = c.Id</code></pre>
      <p class="small">左边那张表永远全量保留，右边没有匹配就补 <code>NULL</code>。用内连接会把它们整行丢掉。</p>`
    },
    task: {
      type: "choice",
      q: "「查出所有客户，以及他们下过几单（没下过单的显示 0）」——应该用哪种连接？",
      opts: [
        "JOIN（内连接）——只保留有订单的客户",
        "LEFT JOIN（左连接）——以 Customer 为左表，全部保留",
        "不需要连接，直接查 Orders 就行"
      ],
      a: 1,
      why: "关键字「所有客户」= 左边必须全量。内连接会把没下过单的客户筛掉，正好答错题目。"
    }
  },
  {
    teach: {
      t: "COUNT 的小陷阱：0 还是 1？",
      body: `<p>统计「没下单客户」的订单数时，两种写法结果不同：</p>
      <pre><code><span class="fn">COUNT</span>(*)       <span class="cm">-- 数行数：左连接的 NULL 行也算 1</span>
<span class="fn">COUNT</span>(o.Id)    <span class="cm">-- 数这一列非空的行：NULL 不计，结果是 0</span></code></pre>
      <p class="small">所以「没下单的显示 0」必须写 <code>COUNT(o.Id)</code>。</p>`
    },
    task: {
      type: "choice",
      q: "要统计每个客户的订单数，且没下过单的客户显示 0，COUNT 里应该写什么？",
      opts: [
        "COUNT(*)",
        "COUNT(o.Id)",
        "COUNT(1)"
      ],
      a: 1,
      why: "<code>COUNT(*)</code> 和 <code>COUNT(1)</code> 都会把左连接补出来的那一行算成 1，结果变成「1 单」——这是这道题最经典的错。"
    }
  },
  {
    teach: {
      t: "GROUP BY：分组统计的规矩",
      body: `<p>按谁分组就 <code>GROUP BY</code> 谁；要算的数用聚合函数包起来。</p>
      <pre><code><span class="kw">SELECT</span> c.CustomerName, <span class="fn">SUM</span>(o.Amount) <span class="kw">AS</span> 总金额
<span class="kw">FROM</span> Orders o <span class="kw">JOIN</span> Customer c <span class="kw">ON</span> c.Id = o.CustomerId
<span class="kw">GROUP BY</span> c.CustomerName</code></pre>
      <p class="small">铁律：<code>SELECT</code> 里的列，要么出现在 <code>GROUP BY</code>，要么被聚合函数包住。</p>`
    },
    task: {
      type: "choice",
      q: "下面哪条查询是对的？（按客户统计总金额）",
      opts: [
        "SELECT c.CustomerName, o.OrderDate, SUM(o.Amount) FROM Orders o JOIN Customer c ON c.Id=o.CustomerId GROUP BY c.CustomerName",
        "SELECT c.CustomerName, SUM(o.Amount) FROM Orders o JOIN Customer c ON c.Id=o.CustomerId GROUP BY c.CustomerName",
        "SELECT c.CustomerName, SUM(o.Amount) FROM Orders o JOIN Customer c ON c.Id=o.CustomerId"
      ],
      a: 1,
      why: "第一条错在 <code>o.OrderDate</code> 既没分组也没聚合；第三条错在用了聚合却没 <code>GROUP BY</code>（会把整个表合成一行）。"
    }
  },
  {
    teach: {
      t: "WHERE 和 HAVING 的区别",
      body: `<p>同一个「筛选」，位置决定它筛谁：</p>
      <pre><code><span class="kw">WHERE</span>  o.Amount &gt; 1000        <span class="cm">-- 筛原始行</span>
<span class="kw">GROUP BY</span> c.CustomerName
<span class="kw">HAVING</span> <span class="fn">SUM</span>(o.Amount) &gt; 10000  <span class="cm">-- 筛分组结果</span></code></pre>
      <p class="small"><code>WHERE</code> 里绝对不能出现聚合函数，否则直接报错。</p>`
    },
    task: {
      type: "order",
      q: "把下面几个子句按**正确书写顺序**排好（从上到下）：",
      items: [
        "HAVING SUM(o.Amount) > 10000",
        "SELECT c.CustomerName, SUM(o.Amount)",
        "GROUP BY c.CustomerName",
        "FROM Orders o JOIN Customer c ON c.Id = o.CustomerId",
        "WHERE o.OrderDate >= '2026-01-01'"
      ],
      answer: [1, 3, 4, 2, 0],
      why: "顺序：SELECT → FROM/JOIN → WHERE → GROUP BY → HAVING。写作顺序和读的顺序相反，照这个背。"
    }
  },
  {
    teach: {
      t: "关联更新：UPDATE 后面跟别名",
      body: `<p>ERP 里最常见：按产品表的价格，把订单金额重算一遍。</p>
      <pre><code><span class="kw">UPDATE</span> o
<span class="kw">SET</span> o.Amount = o.Qty * p.Price
<span class="kw">FROM</span> Orders o
<span class="kw">JOIN</span> Product p <span class="kw">ON</span> p.Id = o.ProductId
<span class="kw">WHERE</span> o.Status = 0</code></pre>
      <p class="small">注意：<code>UPDATE</code> 后面是<strong>别名</strong>，表在 <code>FROM</code> 里连起来——这是 SQL Server 的招牌写法。</p>`
    },
    task: {
      type: "build",
      q: "拼一条关联更新：把「电子」分类的产品单价上调 5%。",
      tokens: ["UPDATE", "Product", "SET", "Price = Price * 1.05", "FROM", "WHERE", "Category = N'电子'", "JOIN"],
      answer: ["UPDATE", "Product", "SET", "Price = Price * 1.05", "WHERE", "Category = N'电子'"],
      why: "单表更新不需要 <code>FROM</code>/<code>JOIN</code>。只有要「按另一张表的数据改」时才用 <code>UPDATE 别名 … FROM … JOIN …</code>。"
    }
  },
  {
    teach: {
      t: "套打：主表 + 明细，为什么必须 LEFT",
      body: `<p>一张单据 = 表头 1 行 + 明细 N 行：</p>
      <pre><code><span class="kw">SELECT</span> m.BillNo, d.LineNo, d.ProductName, d.Qty
<span class="kw">FROM</span> BillMaster m
<span class="kw">LEFT JOIN</span> BillDetail d <span class="kw">ON</span> d.BillId = m.Id</code></pre>
      <p class="small">没有明细的单据也要打出来（留空白行）。用 <code>JOIN</code> 会把这整张单据丢掉——这是套打题最大的判分点。</p>`
    },
    task: {
      type: "choice",
      q: "套打单据时要「没有明细的单据也打印出来」，应该怎么写？",
      opts: [
        "FROM BillMaster m JOIN BillDetail d ON d.BillId = m.Id",
        "FROM BillDetail d JOIN BillMaster m ON m.Id = d.BillId",
        "FROM BillMaster m LEFT JOIN BillDetail d ON d.BillId = m.Id"
      ],
      a: 2,
      why: "主表是「不能少」的一方，所以它必须在左边、用 LEFT JOIN。反过来写或用内连接，空单据都会消失。"
    }
  },
  {
    teach: {
      t: "事务：要么全做，要么全不做",
      body: `<p>转账：扣钱和加钱必须同时成功，否则钱会凭空消失。</p>
      <pre><code><span class="kw">BEGIN TRAN</span>
<span class="kw">UPDATE</span> Account <span class="kw">SET</span> Balance = Balance - 100 <span class="kw">WHERE</span> Id = 1
<span class="kw">UPDATE</span> Account <span class="kw">SET</span> Balance = Balance + 100 <span class="kw">WHERE</span> Id = 2
<span class="kw">COMMIT TRAN</span>   <span class="cm">-- 出错时用 ROLLBACK TRAN</span></code></pre>
      <p class="small">三个关键字：<code>BEGIN TRAN</code> / <code>COMMIT</code> / <code>ROLLBACK</code>。</p>`
    },
    task: {
      type: "fill",
      q: "事务执行到一半出错，要把已经做的改动全部撤销，用什么关键字？（填一个词）",
      tpl: "BEGIN TRAN\n  ...\n___ TRAN;",
      accept: ["rollback", "rollback tran", "rollback transaction"],
      hint: "R 开头，和 COMMIT 相反",
      why: "<code>ROLLBACK TRAN</code>。答出「回滚」概念即可，卷面上写出这个关键字就是得分点。"
    }
  },
  {
    teach: {
      t: "最后一关：把学过的拼起来",
      body: `<p>这道题就是明天笔试的典型大题：<strong>连接 + 分组 + 筛选 + 排序</strong>，一样不少。</p>
      <pre><code>查 2026 年每个客户的总金额，
只保留超过 1 万的，按金额倒序</code></pre>
      <p class="small">先想清楚四件事：连哪两张表、按谁分组、条件在 WHERE 还是 HAVING、怎么排。</p>`
    },
    task: {
      type: "build",
      q: "拼出完整答案。",
      tokens: ["SELECT", "c.CustomerName, SUM(o.Amount) AS 总金额", "FROM", "Orders o JOIN Customer c ON c.Id = o.CustomerId", "WHERE", "o.OrderDate >= '2026-01-01'", "GROUP BY", "c.CustomerName", "HAVING", "SUM(o.Amount) > 10000", "ORDER BY", "SUM(o.Amount) DESC"],
      answer: ["SELECT", "c.CustomerName, SUM(o.Amount) AS 总金额", "FROM", "Orders o JOIN Customer c ON c.Id = o.CustomerId", "WHERE", "o.OrderDate >= '2026-01-01'", "GROUP BY", "c.CustomerName", "HAVING", "SUM(o.Amount) > 10000", "ORDER BY", "SUM(o.Amount) DESC"],
      why: "这就是标准答案的骨架。明天遇到任何「按 X 统计 Y，只要超过 Z 的」都可以套：FROM/JOIN → WHERE 时间 → GROUP BY → HAVING 聚合条件 → ORDER BY。"
    }
  }
];

/* ============================ 状态 ============================ */
const state = {
  i: 0, xp: 0, combo: 0, maxCombo: 0, wrong: [], finished: false,
  answered: false
};
const $ = (s) => document.querySelector(s);
const stage = $("#stage");
const hud = $("#hud");
const toastEl = $("#toast");

const esc = (s) => String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));

function save() {
  try { localStorage.setItem("sqlgame", JSON.stringify({ i: state.i, xp: state.xp, wrong: state.wrong })); } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem("sqlgame");
    if (!raw) return;
    const d = JSON.parse(raw);
    if (typeof d.i === "number" && d.i > 0 && d.i < LEVELS.length) { state.i = d.i; state.xp = d.xp || 0; state.wrong = d.wrong || []; }
  } catch (e) {}
}

function toast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add("on");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => toastEl.classList.remove("on"), 1300);
}

function burst(color) {
  const box = $("#spark");
  for (let k = 0; k < 18; k++) {
    const el = document.createElement("i");
    el.style.left = (45 + Math.random() * 10) + "%";
    el.style.top = "30%";
    el.style.background = color || "#37d6a5";
    el.style.animationDelay = (Math.random() * 0.15) + "s";
    box.appendChild(el);
    setTimeout(() => el.remove(), 1400);
  }
}

function updateHud() {
  $("#lvlNo").textContent = Math.min(state.i + 1, LEVELS.length);
  $("#xp").textContent = state.xp;
  const c = $("#combo");
  c.textContent = "×" + Math.max(1, state.combo);
  c.classList.toggle("on", state.combo > 1);
  $("#bar").style.width = (state.i / LEVELS.length * 100) + "%";
}

/* ============================ 首页 ============================ */
function renderStart() {
  hud.style.display = "none";
  stage.innerHTML = `
    <div class="hero">
      <div class="badge">12 关 · 约 40 分钟 · 明天笔试够用</div>
      <h1>SQL 闯关</h1>
      <p class="small">每关先讲 20 秒，再让你动手拼一句 SQL。<br>做对加经验，连对翻倍；做错讲清为什么，可以重来。</p>
      <div class="big">🎯</div>
      <button class="primary" id="start" style="width:100%;max-width:320px">开始第一关</button>
      <p class="small" style="margin-top:16px">想先看完整讲解？<a href="course.html">打开课程版</a>　·　考前速查：<a href="study.html">速查表</a></p>
    </div>`;
  $("#start").onclick = () => { state.i = 0; state.xp = 0; state.combo = 0; render(); };
}

/* ============================ 关卡 ============================ */
function render() {
  if (state.i >= LEVELS.length) return renderEnd();
  hud.style.display = "block";
  updateHud();
  state.answered = false;
  const L = LEVELS[state.i];
  stage.innerHTML = `
    <div class="card teach">
      <div class="kicker">讲解 · 第 ${state.i + 1} 关</div>
      <h2>${esc(L.teach.t)}</h2>
      ${L.teach.body}
      <div class="actions"><button class="primary" id="goTask">我懂了，出题 →</button></div>
    </div>
    <div id="taskBox"></div>`;
  $("#goTask").onclick = () => renderTask();
}

function renderTask() {
  const L = LEVELS[state.i];
  const T = L.task;
  const box = $("#taskBox");
  const head = `<div class="card"><div class="kicker task">动手题</div><h2>${esc(T.q)}</h2>`;

  if (T.type === "choice") {
    box.innerHTML = head + T.opts.map((o, k) =>
      `<button class="opt" data-k="${k}"><code>${esc(o)}</code></button>`).join("") +
      `</div><div class="fb" id="fb"></div>`;
    box.querySelectorAll(".opt").forEach((b) => {
      b.onclick = () => {
        if (state.answered) return;
        const k = +b.dataset.k;
        if (k === T.a) { b.classList.add("right"); answer(true); }
        else {
          b.classList.add("wrong");
          if (!state.wrong.includes(state.i)) state.wrong.push(state.i);
          answer(false);
        }
      };
    });
  }

  if (T.type === "fill") {
    box.innerHTML = head +
      `<pre><code>${esc(T.tpl)}</code></pre>
       <input type="text" id="inp" placeholder="在这里输入…" autocomplete="off" autocapitalize="off" spellcheck="false">
       <div class="actions"><button class="primary" id="sub">提交</button></div></div>
       <div class="fb" id="fb"></div>`;
    const submit = () => {
      if (state.answered) return;
      const v = ($("#inp").value || "").trim().toLowerCase().replace(/;+$/, "").replace(/\s+/g, " ");
      const ok = T.accept.some((a) => v === a || v.endsWith(a));
      if (!ok && !state.wrong.includes(state.i)) state.wrong.push(state.i);
      answer(ok);
    };
    $("#sub").onclick = submit;
    $("#inp").addEventListener("keydown", (e) => { if (e.key === "Enter") submit(); });
  }

  if (T.type === "build") {
    const pool = T.tokens.map((t, k) => ({ t, k, used: false }));
    box.innerHTML = head +
      `<div class="tray empty" id="tray"></div>
       <div class="pool" id="pool">${pool.map((p) => `<button class="tok" data-k="${p.k}">${esc(p.t)}</button>`).join("")}</div>
       <div class="actions">
         <button class="ghost" id="reset">清空</button>
         <button class="primary" id="sub">检查</button>
       </div></div><div class="fb" id="fb"></div>`;
    const picked = [];
    const tray = $("#tray");
    const sync = () => {
      tray.classList.toggle("empty", picked.length === 0);
      tray.innerHTML = picked.map((k, idx) => `<button class="tok" data-idx="${idx}">${esc(T.tokens[k])}</button>`).join("");
      tray.querySelectorAll("[data-idx]").forEach((b) => {
        b.onclick = () => { picked.splice(+b.dataset.idx, 1); sync(); };
      });
      box.querySelectorAll("#pool .tok").forEach((b) => {
        b.classList.toggle("used", picked.includes(+b.dataset.k));
      });
    };
    box.querySelectorAll("#pool .tok").forEach((b) => {
      b.onclick = () => { if (!picked.includes(+b.dataset.k)) { picked.push(+b.dataset.k); sync(); } };
    });
    $("#reset").onclick = () => { picked.length = 0; sync(); };
    $("#sub").onclick = () => {
      if (state.answered) return;
      const target = T.answer.map((t) => T.tokens.indexOf(t));
      const ok = picked.length === target.length && picked.every((k, idx) => k === target[idx]);
      if (!ok && !state.wrong.includes(state.i)) state.wrong.push(state.i);
      answer(ok);
    };
  }

  if (T.type === "order") {
    let cur = T.items.map((_, k) => k).sort(() => Math.random() - 0.5);
    box.innerHTML = head + `<div id="list"></div>
      <div class="actions"><button class="primary" id="sub">检查顺序</button></div></div>
      <div class="fb" id="fb"></div>`;
    const draw = () => {
      $("#list").innerHTML = cur.map((k, idx) => `
        <div class="ord">
          <div class="n">${idx + 1}</div>
          <div class="txt">${esc(T.items[k])}</div>
          <div class="mv">
            <button data-up="${idx}" ${idx === 0 ? "disabled" : ""}>↑</button>
            <button data-dn="${idx}" ${idx === cur.length - 1 ? "disabled" : ""}>↓</button>
          </div>
        </div>`).join("");
      box.querySelectorAll("[data-up]").forEach((b) => b.onclick = () => {
        const n = +b.dataset.up; [cur[n - 1], cur[n]] = [cur[n], cur[n - 1]]; draw();
      });
      box.querySelectorAll("[data-dn]").forEach((b) => b.onclick = () => {
        const n = +b.dataset.dn; [cur[n + 1], cur[n]] = [cur[n], cur[n + 1]]; draw();
      });
    };
    draw();
    $("#sub").onclick = () => {
      if (state.answered) return;
      const ok = cur.every((k, idx) => k === T.answer[idx]);
      if (!ok && !state.wrong.includes(state.i)) state.wrong.push(state.i);
      answer(ok);
    };
  }
}

function answer(ok) {
  state.answered = true;
  const T = LEVELS[state.i].task;
  const fb = $("#fb");
  if (ok) {
    state.combo += 1;
    state.maxCombo = Math.max(state.maxCombo, state.combo);
    const gain = 10 + Math.min(state.combo - 1, 4) * 5;
    state.xp += gain;
    fb.className = "fb ok show";
    fb.innerHTML = `<b>对了 +${gain} 经验${state.combo > 1 ? "（连击 ×" + state.combo + "）" : ""}</b>${T.why}`;
    burst(state.combo >= 3 ? "#ffd166" : "#37d6a5");
    if (state.combo >= 3) toast("连击 ×" + state.combo + "！手感来了");
    updateHud();
    save();
    const btn = document.createElement("button");
    btn.className = "primary";
    btn.textContent = state.i === LEVELS.length - 1 ? "看看成绩 →" : "下一关 →";
    btn.style.marginTop = "12px";
    btn.onclick = () => { state.i += 1; render(); };
    fb.appendChild(btn);
    btn.focus();
  } else {
    state.combo = 0;
    fb.className = "fb no show";
    fb.innerHTML = `<b>差一点，再看一眼</b>${T.why}`;
    updateHud();
    const btn = document.createElement("button");
    btn.className = "ghost";
    btn.textContent = "重新试一次";
    btn.style.marginTop = "12px";
    btn.onclick = () => { state.answered = false; renderTask(); };
    fb.appendChild(btn);
  }
}

/* ============================ 结算 ============================ */
function renderEnd() {
  state.finished = true;
  hud.style.display = "block";
  state.i = LEVELS.length;
  $("#lvlNo").textContent = LEVELS.length;
  $("#bar").style.width = "100%";
  const perfect = state.wrong.length === 0;
  const rank = perfect ? "王者 · 全对通关" : state.wrong.length <= 2 ? "黄金 · 稳过笔试" : state.wrong.length <= 4 ? "白银 · 再刷一遍错题" : "青铜 · 建议重来";
  try { localStorage.removeItem("sqlgame"); } catch (e) {}
  stage.innerHTML = `
    <div class="card end" style="text-align:center">
      <div class="big">${perfect ? "🏆" : "🎉"}</div>
      <div class="rank">${rank}</div>
      <p class="small">经验 ${state.xp} · 最高连击 ×${Math.max(1, state.maxCombo)} · 答错 ${state.wrong.length} 关</p>
      ${state.wrong.length ? `<div style="text-align:left;margin-top:18px"><p class="small">需要再看一眼的关卡：</p>` +
        state.wrong.map((k) => `<div class="review"><div class="t">第 ${k + 1} 关 · ${esc(LEVELS[k].teach.t)}</div></div>`).join("") + `</div>` : ""}
      <div class="actions" style="margin-top:20px">
        <button id="again">再刷一遍</button>
        <button class="primary" id="next2">去模拟卷</button>
      </div>
      <p class="small" style="margin-top:16px">想把讲解看全：<a href="course.html">课程版</a>　·　考前 10 分钟：<a href="study.html">速查表</a></p>
    </div>`;
  burst("#ffd166");
  $("#again").onclick = () => { state.i = 0; state.xp = 0; state.combo = 0; state.maxCombo = 0; state.wrong = []; render(); };
  $("#next2").onclick = () => { location.href = "/sql#l8"; };
}

/* ============================ 启动 ============================ */
load();
updateHud();
if (state.i > 0) { state.xp = state.xp || 0; render(); toast("接着上次继续"); }
else renderStart();
</script>
