<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>写码教练 · 一句一句带你写 SQL</title>
<style>
  :root{--bg:#0b0e13;--panel:#141922;--panel2:#1b2230;--line:#27303f;--fg:#e8eef8;--muted:#8a94a6;--accent:#5b8cff;--ok:#37d6a5;--bad:#ff7a7a;--gold:#ffd166;--code:#070a0e}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--fg);font:16px/1.6 -apple-system,"PingFang SC","Microsoft YaHei",system-ui,sans-serif}
  .app{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  /* 顶栏 */
  .top{flex:0 0 auto;padding:10px 16px 8px;border-bottom:1px solid var(--line);background:var(--panel)}
  .top .row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .top .t{font-size:14.5px;font-weight:650}
  .top .t span{color:var(--muted);font-weight:400;font-size:12.5px}
  .top .p{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
  .track{height:4px;background:var(--line);border-radius:3px;margin-top:8px;overflow:hidden}
  .track i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--accent),var(--ok));transition:width .35s}
  /* 任务 */
  .task{flex:0 0 auto;padding:9px 16px;font-size:13.5px;color:var(--muted);background:#101520;border-bottom:1px solid var(--line)}
  .task b{color:var(--fg);font-weight:600}
  /* 代码区 */
  .code{flex:1 1 auto;overflow:auto;padding:14px 16px;background:var(--code);font-family:ui-monospace,Consolas,"Courier New",monospace;font-size:14.5px;line-height:1.85}
  .code .ln{display:flex;gap:10px;animation:in .28s ease-out}
  .code .ln .n{flex:0 0 16px;color:#3c4759;text-align:right;font-size:12px;line-height:1.85;user-select:none}
  .code .ln .c{white-space:pre-wrap;word-break:break-word}
  .code .ln.new{background:rgba(55,214,165,.09);border-radius:6px;margin:0 -6px;padding:0 6px}
  .kw{color:#ff9f5a;font-weight:600}
  .fn{color:#8ab4ff}
  .st{color:#7ee08a}
  .cm{color:#4d5a6e}
  .caret{display:inline-block;width:8px;height:15px;background:var(--ok);vertical-align:-2px;animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  @keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
  /* 提问区 */
  .ask{flex:0 0 auto;max-height:56dvh;overflow:auto;padding:14px 16px 16px;background:var(--panel);border-top:1px solid var(--line)}
  .ask .who{display:flex;gap:9px;margin-bottom:10px}
  .avatar{flex:0 0 30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#5b8cff,#37d6a5);display:grid;place-items:center;font-size:15px}
  .bubble{background:var(--panel2);border:1px solid var(--line);border-radius:2px 12px 12px 12px;padding:10px 13px;font-size:15.5px;line-height:1.6}
  .bubble b{color:var(--gold)}
  .opts{display:flex;flex-direction:column;gap:9px}
  .opts button{text-align:left;padding:13px 14px;border-radius:12px;border:1px solid var(--line);background:var(--panel2);color:var(--fg);font:inherit;font-size:14px;line-height:1.5;cursor:pointer;transition:border-color .15s,background .15s}
  .opts button code{font-family:ui-monospace,Consolas,monospace;font-size:13.5px;color:#cfe0ff}
  .opts button:active{transform:scale(.99)}
  .opts button.right{border-color:var(--ok);background:rgba(55,214,165,.12)}
  .opts button.wrong{border-color:var(--bad);background:rgba(255,122,122,.1);animation:shake .32s}
  @keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
  .fb{margin-top:10px;font-size:14px;padding:10px 12px;border-radius:10px;display:none}
  .fb.on{display:block;animation:in .25s}
  .fb.ok{background:rgba(55,214,165,.1);border:1px solid rgba(55,214,165,.35)}
  .fb.no{background:rgba(255,122,122,.09);border:1px solid rgba(255,122,122,.3)}
  .next{margin-top:12px;width:100%;padding:15px;border-radius:12px;border:0;background:linear-gradient(135deg,var(--accent),#4570e6);color:#fff;font:inherit;font-size:16px;font-weight:650;cursor:pointer;display:none}
  .next.on{display:block}
  /* 完成页 */
  .done{flex:1 1 auto;overflow:auto;padding:26px 20px;display:flex;flex-direction:column;justify-content:center;text-align:center}
  .done .big{font-size:44px;margin-bottom:8px}
  .done h2{margin:0 0 6px;font-size:20px}
  .done p{color:var(--muted);font-size:14px;margin:4px 0 16px}
  .done .sqlbox{text-align:left;background:var(--code);border:1px solid var(--line);border-radius:12px;padding:13px;font-family:ui-monospace,Consolas,monospace;font-size:13.5px;line-height:1.75;overflow-x:auto;margin-bottom:16px}
  .done button{width:100%;padding:15px;border-radius:12px;font:inherit;font-size:16px;font-weight:650;border:1px solid var(--line);background:var(--panel2);color:var(--fg);margin-bottom:10px;cursor:pointer}
  .done button.go{border:0;background:linear-gradient(135deg,var(--accent),#4570e6);color:#fff}
  .hide{display:none!important}

  /* --- 移动端基础修补（自动注入） --- */
  @media (prefers-reduced-motion:reduce){
    *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important}
  }
  a,button,input,select,textarea,summary,[role="button"]{touch-action:manipulation}
  :focus-visible{outline:2px solid currentColor;outline-offset:2px}
</style>
</head>
<body>
<div class="app" id="app"></div>

<script>
"use strict";

/* ============ 题目：每题 = 任务 + 若干步 ============ */
const TASKS = [
  {
    title: "查 11 月金额超过 2000 的订单",
    brief: "老板让你把 11 月金额大于 2000 的订单列出来，按金额从大到小。",
    steps: [
      {
        ask: "第一句永远是 <b>SELECT</b>。你要哪几列？",
        opts: ["OrderNo, Amount, OrderDate", "*", "Amount"],
        a: 0,
        add: ["SELECT OrderNo, Amount, OrderDate"],
        why: "老板要「订单」，所以取订单号、金额、日期。用 * 会把几十个字段全拖出来，报表里没法看。"
      },
      {
        ask: "然后写 <b>FROM</b>，从哪张表拿？",
        opts: ["FROM Orders", "FROM Customer", "FROM Product"],
        a: 0,
        add: ["FROM Orders"],
        why: "订单数据只在 Orders（订单表）里。这一步决定你翻哪本账。"
      },
      {
        ask: "筛条件：11 月 且 金额大于 2000，怎么拼？",
        opts: [
          "WHERE Amount > 2000 AND OrderDate >= '2026-11-01' AND OrderDate < '2026-12-01'",
          "WHERE OrderDate = '2026-11'",
          "WHERE Amount > 2000"
        ],
        a: 0,
        add: ["WHERE Amount > 2000", "  AND OrderDate >= '2026-11-01'", "  AND OrderDate < '2026-12-01'"],
        why: "日期区间用「大于等于月初 且 小于下月初」。用 = '2026-11' 查不到任何数据，这是最常见的错。"
      },
      {
        ask: "最后排序：金额从大到小怎么写？",
        opts: ["ORDER BY Amount DESC;", "ORDER BY Amount;", "不用排序"],
        a: 0,
        add: ["ORDER BY Amount DESC;"],
        why: "DESC = 倒序（从大到小）。不写 DESC 默认升序，老板会以为你把最大的藏起来了。"
      }
    ]
  },
  {
    title: "订单号 + 客户名字",
    brief: "订单表里只有客户编号，名字在客户表——要跨两张表取字段。",
    steps: [
      {
        ask: "既要订单号又要客户名，<b>SELECT</b> 怎么写？",
        opts: ["o.OrderNo, c.CustomerName", "OrderNo, CustomerName", "o.*"],
        a: 0,
        add: ["SELECT o.OrderNo, c.CustomerName"],
        why: "两张表分别起别名 o、c，字段前带前缀。不写前缀，两张表都有同名列时你自己都会写混。"
      },
      {
        ask: "先写第一张表：<b>FROM</b> 谁？",
        opts: ["FROM Orders o", "FROM Customer c", "FROM Orders, Customer"],
        a: 0,
        add: ["FROM Orders o"],
        why: "从订单表出发（因为「每笔订单」是主视角），再把它需要的客户信息连过来。"
      },
      {
        ask: "关键是这一句：怎么把客户表连上？",
        opts: [
          "JOIN Customer c ON c.Id = o.CustomerId",
          "JOIN Customer c ON c.Phone = o.OrderNo",
          "不需要连，直接写名字"
        ],
        a: 0,
        add: ["JOIN Customer c ON c.Id = o.CustomerId;"],
        why: "ON 后面是「两张表怎么对上」：客户的 Id = 订单里的 CustomerId。这一行是整道题的灵魂。"
      }
    ]
  },
  {
    title: "每个客户的订单数（0 也要显示）",
    brief: "老板要「所有客户下了几单」，没下过单的也要出现，显示 0。",
    steps: [
      {
        ask: "要「客户名 + 订单数」，<b>SELECT</b> 怎么写？",
        opts: [
          "c.CustomerName, COUNT(o.Id) AS 订单数",
          "c.CustomerName, COUNT(*) AS 订单数",
          "c.CustomerName, o.Id"
        ],
        a: 0,
        add: ["SELECT c.CustomerName, COUNT(o.Id) AS 订单数"],
        why: "必须数右表主键 COUNT(o.Id)。用 COUNT(*) 会把「没下单补出来的空行」也数成 1，结果全变 1 单。"
      },
      {
        ask: "「所有客户」= 左边必须全保留。怎么写？",
        opts: [
          "FROM Customer c LEFT JOIN Orders o ON o.CustomerId = c.Id",
          "FROM Orders o LEFT JOIN Customer c ON c.Id = o.CustomerId",
          "FROM Customer c JOIN Orders o ON o.CustomerId = c.Id"
        ],
        a: 0,
        add: ["FROM Customer c", "LEFT JOIN Orders o ON o.CustomerId = c.Id"],
        why: "谁必须全部出现，谁放左边。写反或者用 INNER，没下单的客户会直接消失——正好是老板要的那部分。"
      },
      {
        ask: "那为什么必须加 <b>GROUP BY</b>？",
        opts: [
          "因为用了 COUNT，要按客户把行压成一行",
          "为了排序",
          "因为用了 LEFT JOIN"
        ],
        a: 0,
        add: ["GROUP BY c.CustomerName;"],
        why: "COUNT 是聚合函数，它要「一组」才数得出来。GROUP BY 就是告诉它：按客户名分组，每个客户一组。"
      }
    ]
  },
  {
    title: "压轴：按客户统计，只留超 1 万的",
    brief: "明天笔试最可能出的大题：连接 + 分组 + 筛选 + 排序，一步都不少。",
    steps: [
      {
        ask: "<b>SELECT</b>：客户名 + 总金额。",
        opts: ["c.CustomerName, SUM(o.Amount) AS 总金额", "c.CustomerName, o.Amount", "*"],
        a: 0,
        add: ["SELECT c.CustomerName, SUM(o.Amount) AS 总金额"],
        why: "「总共」= SUM。起个中文别名 AS 总金额，阅卷老师一眼看懂，等于白送分。"
      },
      {
        ask: "<b>FROM + JOIN</b>：连起来。",
        opts: [
          "FROM Orders o JOIN Customer c ON c.Id = o.CustomerId",
          "FROM Orders o",
          "FROM Customer c"
        ],
        a: 0,
        add: ["FROM Orders o", "JOIN Customer c ON c.Id = o.CustomerId"],
        why: "要客户名就得连客户表；金额在订单表，所以从订单表出发。"
      },
      {
        ask: "2026 年的数据 —— 条件写哪？",
        opts: [
          "WHERE o.OrderDate >= '2026-01-01'",
          "WHERE SUM(o.Amount) > 10000",
          "HAVING o.OrderDate >= '2026-01-01'"
        ],
        a: 0,
        add: ["WHERE o.OrderDate >= '2026-01-01'"],
        why: "按原始行的日期筛选，用 WHERE。第二条把聚合写进 WHERE 直接报错（这是下一个坎）。"
      },
      {
        ask: "<b>GROUP BY</b>：按谁分组？",
        opts: ["GROUP BY c.CustomerName", "GROUP BY o.Amount", "GROUP BY c.Id, o.Id"],
        a: 0,
        add: ["GROUP BY c.CustomerName"],
        why: "SELECT 里除了聚合之外出现了客户名，所以必须按客户名分。规律：SELECT 里没被聚合的列，都要进 GROUP BY。"
      },
      {
        ask: "只保留总金额超过 1 万的 —— 这条写哪？",
        opts: [
          "HAVING SUM(o.Amount) > 10000",
          "WHERE SUM(o.Amount) > 10000",
          "HAVING o.Amount > 10000"
        ],
        a: 0,
        add: ["HAVING SUM(o.Amount) > 10000"],
        why: "筛「组」用 HAVING，筛「行」用 WHERE。聚合条件放进 WHERE 是语法错误——明天最可能在这儿扣分。"
      },
      {
        ask: "最后按总金额从大到小。",
        opts: ["ORDER BY SUM(o.Amount) DESC;", "ORDER BY c.CustomerName;", "不用排序"],
        a: 0,
        add: ["ORDER BY SUM(o.Amount) DESC;"],
        why: "就这一步收尾。到这里你已经把「连接 + 分组 + HAVING + 排序」全写出来了——这就是压轴题的标准答案。"
      }
    ]
  }
];

/* ============ 状态 ============ */
const app = document.getElementById("app");
let ti = 0;         // 题目下标
let si = 0;         // 步骤下标
let lines = [];     // 已写出的代码行
let locked = false; // 防重复点击

function esc(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

// 简易高亮
function hl(s) {
  return esc(s)
    .replace(/\b(SELECT|FROM|WHERE|JOIN|LEFT JOIN|GROUP BY|HAVING|ORDER BY|AS|AND|DESC|COUNT|SUM|ON)\b/g, '<span class="kw">$1</span>')
    .replace(/\b(COUNT|SUM)\b/g, '<span class="fn">$1</span>')
    .replace(/'([^']*)'/g, '<span class="st">\'$1\'</span>');
}

function totalSteps() {
  return TASKS.reduce((n, t) => n + t.steps.length, 0);
}
function doneSteps() {
  let n = 0;
  for (let i = 0; i < ti; i++) n += TASKS[i].steps.length;
  return n + si;
}

function render() {
  if (ti >= TASKS.length) return renderDone();
  const T = TASKS[ti];
  const S = T.steps[si];
  const pct = (doneSteps() / totalSteps()) * 100;

  app.innerHTML = `
    <div class="top">
      <div class="row">
        <div class="t">第 ${ti + 1}/${TASKS.length} 题 <span>· ${T.title}</span></div>
        <div class="p">${si + 1}/${T.steps.length}</div>
      </div>
      <div class="track"><i style="width:${pct}%"></i></div>
    </div>
    <div class="task">目标：<b>${T.brief}</b></div>
    <div class="code" id="code">
      ${lines.map((l, i) => `<div class="ln${i === lines.length - 1 ? " new" : ""}"><span class="n">${i + 1}</span><span class="c">${hl(l)}</span></div>`).join("")}
      <div class="ln"><span class="n">${lines.length + 1}</span><span class="c"><span class="caret"></span></span></div>
    </div>
    <div class="ask" id="ask">
      <div class="who"><div class="avatar">🧑‍🏫</div><div class="bubble">${S.ask}</div></div>
      <div class="opts" id="opts">
        ${S.opts.map((o, k) => `<button data-k="${k}"><code>${esc(o)}</code></button>`).join("")}
      </div>
      <div class="fb" id="fb"></div>
      <button class="next" id="next">下一步 →</button>
    </div>`;

  locked = false;
  const codeEl = document.getElementById("code");
  codeEl.scrollTop = codeEl.scrollHeight;

  document.querySelectorAll("#opts button").forEach((b) => {
    b.onclick = () => pick(Number(b.dataset.k), b);
  });
}

function pick(k, btn) {
  if (locked) return;
  const S = TASKS[ti].steps[si];
  const fb = document.getElementById("fb");

  if (k !== S.a) {
    btn.classList.add("wrong");
    fb.className = "fb no on";
    fb.innerHTML = "<b>再想想</b>这一步不对，点另一个试试。";
    setTimeout(() => btn.classList.remove("wrong"), 700);
    return;
  }

  locked = true;
  btn.classList.add("right");
  S.add.forEach((l) => lines.push(l));
  fb.className = "fb ok on";
  fb.innerHTML = "<b>对，就是这么写</b>" + S.why;

  const codeEl = document.getElementById("code");
  codeEl.innerHTML = lines.map((l, i) => `<div class="ln${i >= lines.length - S.add.length ? " new" : ""}"><span class="n">${i + 1}</span><span class="c">${hl(l)}</span></div>`).join("")
    + `<div class="ln"><span class="n">${lines.length + 1}</span><span class="c"><span class="caret"></span></span></div>`;
  codeEl.scrollTop = codeEl.scrollHeight;

  const next = document.getElementById("next");
  next.classList.add("on");
  next.textContent = (si === TASKS[ti].steps.length - 1)
    ? (ti === TASKS.length - 1 ? "完成全部 ✓" : "这一题写完了，下一题 →")
    : "下一步 →";
  next.onclick = () => {
    si += 1;
    if (si >= TASKS[ti].steps.length) { si = 0; ti += 1; lines = []; }
    render();
  };
  next.scrollIntoView({ block: "nearest", behavior: "smooth" });
}

function renderDone() {
  const last = TASKS[TASKS.length - 1];
  app.innerHTML = `
    <div class="done">
      <div class="big">🏆</div>
      <h2>四道题的骨架你都亲手写过一遍了</h2>
      <p>明天考场上，照着这个顺序落笔：FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY</p>
      <div class="sqlbox"><pre style="margin:0">${hl(last.steps.map((s) => s.add.join("\n")).join("\n"))}</pre></div>
      <button class="go" id="again">再走一遍（换换手）</button>
      <button id="toDrill">去默写训练 /drill</button>
      <button id="toPaper">去手写试卷 /paper</button>
    </div>`;
  document.getElementById("again").onclick = () => { ti = 0; si = 0; lines = []; render(); };
  document.getElementById("toDrill").onclick = () => { location.href = "/drill"; };
  document.getElementById("toPaper").onclick = () => { location.href = "/paper"; };
}

render();
</script>
</body>
</html>
