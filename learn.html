  @media (prefers-color-scheme:dark){:root{--paper:#14161a;--card:#1b1e24;--ink:#e9eaee;--muted:#9aa0ac;--line:#2b2f37;--line2:#3a404b;--indigo:#9db0ff;--indigo-soft:#1c2336;--rust:#f0a179;--rust-soft:#2a1e17;--green:#6dd3a6;--green-soft:#16241d;--code:#0e1116;--codeink:#e6edf7}}

  .done{text-align:center;padding:30px 18px}

  @media (prefers-reduced-motion:reduce){

<script>
"use strict";

const PARTS = ["多表增删改查", "多表增删改查", "多表增删改查", "多表增删改查", "自定义报表", "自定义报表", "自定义报表", "套打取数", "套打取数", "概念简答"];

const QS = [
  /* ---------- 1 ---------- */
  {
    points: 10, key: "单表查询", stars: "★★",
    teach: {
      title: "先讲：一条查询就是「选表筛排」",
      lead: "SQL 只有四个动作，任何查询都是这四个动作的组合。",
      rules: [
        "<b>SELECT</b> 挑列——我要看哪几栏",
        "<b>FROM</b> 挑表——从哪张表拿",
        "<b>WHERE</b> 筛行——只要满足条件的记录",
        "<b>ORDER BY</b> 排序——按哪栏排、升序还是降序"
      ],
      code: "SELECT 列1, 列2\nFROM 表\nWHERE 条件\nORDER BY 列 DESC;",
      note: "日期筛选用 <code class='inline'>&gt;= 月初 AND &lt; 下月初</code>，比 BETWEEN 稳——不会漏掉月末带时分秒的数据。",
      signals: ["查询", "列出", "显示", "找出"]
    },
    quiz: {
      stem: "查询 2026 年 11 月下单、且金额大于 2000 的订单，显示订单号、金额、下单日期，按金额从高到低排列。"
    },
    ans: {
      code: "SELECT OrderNo, Amount, OrderDate\nFROM Orders\nWHERE Amount > 2000\n  AND OrderDate >= '2026-11-01'\n  AND OrderDate < '2026-12-01'\nORDER BY Amount DESC;",
      points: [
        "SELECT 只要三列，不要写 *",
        "两个条件用 AND 连；日期用区间不用等号",
        "DESC 是从大到小"
      ],
      judge: ["日期区间 5 分", "排序 3 分", "字段 2 分"],
      trap: "写成 <code class='inline'>OrderDate = '2026-11'</code> 查不到任何数据——日期型字段不能和字符串月份比。",
      memo: "记住四个字的顺序：<b>选 → 表 → 筛 → 排</b>。落笔就按这个顺序，不会漏。"
    }
  },
  /* ---------- 2 ---------- */
  {
    points: 10, key: "两表连接", stars: "★★",
    teach: {
      title: "先讲：两张表靠编号对上",
      lead: "客户名字只存一份在客户表，订单表只存客户编号——这叫「关系」。",
      rules: [
        "两张表的桥梁是<b>主键 = 外键</b>：客户表 Id ↔ 订单表 CustomerId",
        "<b>ON</b> 后面写的就是这座桥，写错整题全错",
        "两张表都有 Id，<b>必须起别名</b>（o、c）",
        "字段前带别名前缀，阅卷老师一眼看懂"
      ],
      code: "SELECT o.订单列, c.客户列\nFROM Orders o\nJOIN Customer c\n  ON c.Id = o.CustomerId;",
      note: "读法：「客户的 Id 等于订单里的 CustomerId」。这句话念顺了，ON 就不会写反。",
      signals: ["要显示另一张表的字段", "订单号 + 客户名"]
    },
    quiz: {
      stem: "查询每笔订单的订单号、客户名称、订单金额（订单表只存客户编号，客户名称在客户表）。"
    },
    ans: {
      code: "SELECT o.OrderNo, c.CustomerName, o.Amount\nFROM Orders o\nJOIN Customer c ON c.Id = o.CustomerId;",
      points: [
        "FROM 从订单表出发（主视角是「每笔订单」）",
        "JOIN 客户表，ON 用 Id 对上 CustomerId",
        "SELECT 里的字段带别名前缀"
      ],
      judge: ["ON 条件 5 分", "别名 3 分", "字段 2 分"],
      trap: "写成 <code class='inline'>ON c.Id = o.Id</code>——变成按订单号连客户，结果全错但不会报错，最难发现。",
      memo: "一句话：<b>从「谁」出发，就把谁写在 FROM；要谁的资料，就把谁 JOIN 进来。</b>"
    }
  },
  /* ---------- 3 ---------- */
  {
    points: 12, key: "LEFT JOIN", stars: "★★★",
    teach: {
      title: "先讲：为什么「没下过单的人」最难写",
      lead: "内连接只保留「两边都有」的行；左连接保留左边全部，右边没有就补空。",
      rules: [
        "题目出现<b>「所有」「每个都」「没有…的」</b>→ 要左连接",
        "<b>必须全部出现的那张表放左边</b>，这是方向问题",
        "数数量时用 <b>COUNT(右表主键)</b>，不是 COUNT(*)",
        "原因：没匹配的行，右表整行为空，COUNT(*) 会把它数成 1"
      ],
      code: "-- 左边全保留\nFROM 左表 a\nLEFT JOIN 右表 b ON b.外键 = a.Id\n-- 数右表主键才得 0\nSELECT COUNT(b.Id)",
      note: "类比：<b>点名册</b>。左边是全班名单，右边是交过作业的人；没交的人名字还在，后面写 0。",
      signals: ["所有", "每个…都", "没有…的", "含无明细"]
    },
    quiz: {
      stem: "统计每个客户的订单数量，没有下过单的客户也要显示，数量为 0。"
    },
    ans: {
      code: "SELECT c.CustomerName, COUNT(o.Id) AS 订单数\nFROM Customer c\nLEFT JOIN Orders o ON o.CustomerId = c.Id\nGROUP BY c.CustomerName;",
      points: [
        "客户要全部出现 → Customer 放左、LEFT JOIN",
        "COUNT(o.Id) 不数空值 → 没下单的客户得 0",
        "用了聚合，要 GROUP BY 客户名"
      ],
      judge: ["LEFT JOIN 7 分", "COUNT(o.Id) 5 分"],
      trap: "用 <code class='inline'>JOIN</code>（内连接）：没下单的客户整行被扔掉，正好是题目要的那部分人——直接丢 7 分。",
      memo: "口诀 <b>「左连数 0」</b>：左表全留 + 数右表主键 + 结果是 0。"
    }
  },
  /* ---------- 4 ---------- */
  {
    points: 8, key: "关联更新", stars: "★★★",
    teach: {
      title: "先讲：照着另一张表批量改",
      lead: "单表改数直接 UPDATE；要「按另一张表的数据改」，就把那张表 JOIN 进来。",
      rules: [
        "SQL Server 的招牌写法：<b>UPDATE 后面跟别名</b>",
        "表在 <b>FROM</b> 里连，JOIN 进来提供新数据",
        "SET 里可以引用 JOIN 表的列",
        "WHERE 限定要改的行，<b>千万别漏</b>"
      ],
      code: "UPDATE 别名\nSET 别名.列 = 别的表.列\nFROM 表 别名\nJOIN 另一张表 ON ...\nWHERE 条件;",
      note: "删除是同一个形状：<code class='inline'>DELETE 别名 FROM 表 别名 JOIN ... WHERE ...</code>，只差第一个词。",
      signals: ["按…重算", "根据…更新", "批量修改", "删除…的"]
    },
    quiz: {
      stem: "产品价格调整后，把「未审核」（Status = 0）订单的金额重算为：数量 × 产品表当前单价。"
    },
    ans: {
      code: "UPDATE o\nSET o.Amount = o.Qty * p.Price\nFROM Orders o\nJOIN Product p ON p.Id = o.ProductId\nWHERE o.Status = 0;",
      points: [
        "UPDATE o —— 改的是订单表（别名）",
        "SET 里用 p.Price，数据来自 JOIN 进来的产品表",
        "WHERE 只改未审核的"
      ],
      judge: ["UPDATE 别名 3 分", "FROM/JOIN 3 分", "SET 表达式 2 分"],
      trap: "写成 <code class='inline'>UPDATE Orders SET Amount = Qty * Price</code>——订单表里没有 Price 列，直接报错。",
      memo: "记形状：<b>UPDATE 别名 → SET 别名.列 = 表.列 → FROM 表 别名 JOIN … → WHERE</b>。"
    }
  },
  /* ---------- 5 ---------- */
  {
    points: 10, key: "GROUP BY + HAVING", stars: "★★★",
    teach: {
      title: "先讲：把多行压成一行来算账",
      lead: "订单表一行一笔，报表要「一行一个客户」——这就是分组。",
      rules: [
        "要算合计/计数/平均 → 聚合函数 <b>SUM / COUNT / AVG / MAX / MIN</b>",
        "按谁分组就 <b>GROUP BY 谁</b>",
        "SELECT 里的列，<b>要么在 GROUP BY，要么被聚合</b>",
        "筛「行」用 <b>WHERE</b>，筛「组」用 <b>HAVING</b>"
      ],
      code: "SELECT 分组列, SUM(数值) AS 合计\nFROM 表\nWHERE 行条件\nGROUP BY 分组列\nHAVING SUM(数值) > 阈值\nORDER BY SUM(数值) DESC;",
      note: "写 SQL 的顺序里，WHERE 在 GROUP BY 之前，HAVING 在之后——位置本身就说明了谁筛什么。",
      signals: ["总共", "合计", "几单", "平均", "超过 X"]
    },
    quiz: {
      stem: "统计 2026 年每个客户的下单次数与总金额，只保留总金额超过 10000 的客户，按总金额从高到低排列。"
    },
    ans: {
      code: "SELECT c.CustomerName, COUNT(o.Id) AS 下单次数, SUM(o.Amount) AS 总金额\nFROM Orders o\nJOIN Customer c ON c.Id = o.CustomerId\nWHERE o.OrderDate >= '2026-01-01' AND o.OrderDate < '2027-01-01'\nGROUP BY c.CustomerName\nHAVING SUM(o.Amount) > 10000\nORDER BY SUM(o.Amount) DESC;",
      points: [
        "时间范围属于「行」→ WHERE",
        "总金额超 1 万属于「组」→ HAVING",
        "客户名在 GROUP BY，两个数字被聚合包住，全部合法"
      ],
      judge: ["分组 4 分", "WHERE 3 分", "HAVING 3 分"],
      trap: "把 <code class='inline'>SUM(o.Amount) &gt; 10000</code> 写进 WHERE——聚合函数不能出现在 WHERE，直接语法错误。",
      memo: "一句话分清：<b>WHERE 筛票，HAVING 筛信封。</b>"
    }
  },
  /* ---------- 6 ---------- */
  {
    points: 10, key: "行转列", stars: "★★★",
    teach: {
      title: "先讲：横着的报表怎么做出来",
      lead: "数据库里是纵向的「一行一条记录」，报表要横向的「一行一个客户、12 列月份」。",
      rules: [
        "通用套路：<b>SUM(CASE WHEN 条件 THEN 数值 ELSE 0 END)</b>",
        "每个要变成「列」的维度写一个 CASE",
        "不满足条件的行给 0，SUM 才只累加当月",
        "最后按客户 GROUP BY 一次"
      ],
      code: "SELECT 分组列,\n  SUM(CASE WHEN 月 = 1 THEN 金额 ELSE 0 END) AS M1,\n  SUM(CASE WHEN 月 = 2 THEN 金额 ELSE 0 END) AS M2\nFROM 表\nGROUP BY 分组列;",
      note: "写不完 12 列就写 3 列 + 注明「其余同理」，结构对了按比例给分——别整题空着。",
      signals: ["一行一个 X，N 列一个 Y", "横向 / 矩阵式报表"]
    },
    quiz: {
      stem: "按客户统计 1–12 月各月的订单金额，做成「一行一个客户、12 列一个月」的横向报表。"
    },
    ans: {
      code: "SELECT c.CustomerName,\n  SUM(CASE WHEN MONTH(o.OrderDate) = 1  THEN o.Amount ELSE 0 END) AS M1,\n  SUM(CASE WHEN MONTH(o.OrderDate) = 2  THEN o.Amount ELSE 0 END) AS M2,\n  -- …… 3 到 11 月同样写法 ……\n  SUM(CASE WHEN MONTH(o.OrderDate) = 12 THEN o.Amount ELSE 0 END) AS M12\nFROM Orders o\nJOIN Customer c ON c.Id = o.CustomerId\nWHERE YEAR(o.OrderDate) = 2026\nGROUP BY c.CustomerName;",
      points: [
        "每个月一个 SUM(CASE WHEN MONTH = n THEN 金额 ELSE 0 END)",
        "外层 GROUP BY 客户名",
        "年份条件放 WHERE"
      ],
      judge: ["CASE 结构 5 分", "列数 3 分", "分组 2 分"],
      trap: "用 <code class='inline'>SUM(金额) GROUP BY 月份</code>——出来是 12 <b>行</b>（纵向），题目要的是 12 <b>列</b>。",
      memo: "记住这个「万能模具」：<b>SUM + CASE</b>。只要是「把某个维度摊成列」，都是它。"
    }
  },
  /* ---------- 7 ---------- */
  {
    points: 10, key: "每组取第一", stars: "★★★",
    teach: {
      title: "先讲：每个班的第一名怎么找",
      lead: "「每个客户金额最高的那一单」不是全校第一，是每个班第一——必须先在班内排名。",
      rules: [
        "<b>ROW_NUMBER() OVER (PARTITION BY 分组列 ORDER BY 排序列)</b> 给每行发名次",
        "PARTITION BY = 分班，ORDER BY = 班内排队",
        "名次要在<b>子查询</b>里生成，外层再筛 <b>rn = 1</b>",
        "不能在同一层 WHERE 里直接过滤窗口函数"
      ],
      code: "SELECT * FROM (\n  SELECT 列...,\n    ROW_NUMBER() OVER (PARTITION BY 分组列 ORDER BY 排序列 DESC) AS rn\n  FROM 表\n) t\nWHERE t.rn = 1;",
      note: "不会窗口函数就写子查询版（金额 = 该客户最大金额），也能拿大部分分。<b>别空着。</b>",
      signals: ["每个…最高", "每个…最新", "每个…第一"]
    },
    quiz: {
      stem: "查询每个客户金额最高的那一笔订单（显示客户名、订单号、金额）。"
    },
    ans: {
      code: "SELECT t.CustomerName, t.OrderNo, t.Amount FROM (\n  SELECT c.CustomerName, o.OrderNo, o.Amount,\n         ROW_NUMBER() OVER (PARTITION BY o.CustomerId ORDER BY o.Amount DESC) AS rn\n  FROM Orders o\n  JOIN Customer c ON c.Id = o.CustomerId\n) t\nWHERE t.rn = 1;",
      points: [
        "PARTITION BY 客户，ORDER BY 金额 DESC",
        "整段包成子查询，别名 t",
        "外层 WHERE t.rn = 1 取第一名"
      ],
      judge: ["窗口函数 5 分", "外层次查询 3 分", "rn = 1 2 分"],
      trap: "<code class='inline'>SELECT MAX(Amount) ... GROUP BY CustomerId</code> 只能拿到金额，订单号拿不到——那是另一个客户的钱。",
      memo: "记四个字：<b>分班、排队、编号、举手</b>。"
    }
  },
  /* ---------- 8 ---------- */
  {
    points: 10, key: "套打取数", stars: "★★",
    teach: {
      title: "先讲：一张单据 = 表头 1 行 + 明细 N 行",
      lead: "套打是把数据填进预印好的单据纸（出库单、发票、凭证）。SQL 考的是「一次取全」。",
      rules: [
        "单据信息分两张表：<b>BillMaster（表头）+ BillDetail（明细）</b>",
        "靠 <b>BillId</b> 关联",
        "必须 <b>ORDER BY 明细行号</b>，否则打印顺序乱",
        "用 LEFT JOIN 更稳——明细缺失也能打出表头"
      ],
      code: "SELECT m.单号, m.日期, d.行号, d.商品, d.数量\nFROM BillMaster m\nLEFT JOIN BillDetail d ON d.BillId = m.Id\nWHERE m.BillNo = '单号'\nORDER BY d.LineNo;",
      note: "类比：<b>一张表单</b>。上面填一遍（表头），下面能填很多行（明细）。",
      signals: ["单据", "打印", "表头 + 明细", "出库单"]
    },
    quiz: {
      stem: "打印单据号 CK20261126001 的出库单：显示单号、日期、客户、明细行号、商品名称、数量，按明细行号排序。"
    },
    ans: {
      code: "SELECT m.BillNo, m.BillDate, m.CustomerName,\n       d.LineNo, d.ProductName, d.Qty\nFROM BillMaster m\nLEFT JOIN BillDetail d ON d.BillId = m.Id\nWHERE m.BillNo = 'CK20261126001'\nORDER BY d.LineNo;",
      points: [
        "主表 LEFT JOIN 明细，靠 BillId 关联",
        "WHERE 指定单号",
        "ORDER BY 行号"
      ],
      judge: ["LEFT JOIN 5 分", "条件 3 分", "排序 2 分"],
      trap: "漏掉 <code class='inline'>ORDER BY d.LineNo</code>：数据能出来，但打印顺序乱，单据没法用。",
      memo: "口诀 <b>「套打左连明细」</b>——主表在左，明细靠 JOIN，行号必须排。"
    }
  },
  /* ---------- 9 ---------- */
  {
    points: 10, key: "LEFT JOIN 判分点", stars: "★★★",
    teach: {
      title: "先讲：这道题几乎只在考一件事",
      lead: "「没有明细的单据也要显示」——这是套打题最常见的判分点，考点只有一个词。",
      rules: [
        "主表必须全量 → <b>BillMaster 放左，用 LEFT JOIN</b>",
        "写成 <code class='inline'>JOIN</code> 不会报错，但空明细的单据会<b>整张消失</b>",
        "类型条件用 <b>N'中文'</b>，防止乱码",
        "排序写两级：先单号，再行号"
      ],
      code: "FROM BillMaster m\nLEFT JOIN BillDetail d ON d.BillId = m.Id\nWHERE m.BillType = N'出库'\nORDER BY m.BillNo, d.LineNo;",
      note: "判断方法：问自己「哪张表的数据一个都不能少」——那张表必须在左边。",
      signals: ["所有出库单", "没有明细的也要", "含无明细"]
    },
    quiz: {
      stem: "查询所有出库单的单号、日期、客户、明细行号、商品、数量，没有明细的单据也要显示。"
    },
    ans: {
      code: "SELECT m.BillNo, m.BillDate, m.CustomerName,\n       d.LineNo, d.ProductName, d.Qty\nFROM BillMaster m\nLEFT JOIN BillDetail d ON d.BillId = m.Id\nWHERE m.BillType = N'出库'\nORDER BY m.BillNo, d.LineNo;",
      points: [
        "LEFT JOIN 是本题的核心得分点（9 分）",
        "类型条件 N'出库'",
        "两级排序：单号 + 行号"
      ],
      judge: ["LEFT JOIN 9 分", "条件 1 分"],
      trap: "写成 JOIN：结果看起来「正常」，但空明细的单据全丢了——阅卷直接扣掉绝大部分分。",
      memo: "看到「所有 / 没有…也要」→ 手先在纸上写下 <b>LEFT JOIN</b>，再想别的。"
    }
  },
  /* ---------- 10 ---------- */
  {
    points: 10, key: "概念简答", stars: "★",
    teach: {
      title: "先讲：两道必背的概念题",
      lead: "这类题是送分的，写对术语就有分。",
      rules: [
        "<b>WHERE</b>：分组<b>之前</b>筛原始行，<b>不能</b>用聚合函数",
        "<b>HAVING</b>：分组<b>之后</b>筛组，<b>可以</b>用聚合函数，通常配 GROUP BY",
        "事务三关键字：<b>BEGIN TRAN / COMMIT TRAN / ROLLBACK TRAN</b>",
        "事务作用：一组操作要么全部生效、要么全部不生效"
      ],
      code: "-- 位置就是区别\nWHERE  行条件\nGROUP BY ...\nHAVING 组条件",
      note: "答题模板：「WHERE 筛行、HAVING 筛组；WHERE 不能用聚合，HAVING 可以。」二十来个字，直接满分。",
      signals: ["简述", "区别", "什么是", "写出关键字"]
    },
    quiz: {
      stem: "简述 WHERE 与 HAVING 的区别；并写出事务的三个关键字。"
    },
    ans: {
      code: "WHERE  —— 分组前筛「行」，不能包含聚合函数\nHAVING —— 分组后筛「组」，可以包含聚合函数，通常配合 GROUP BY\n\n事务：BEGIN TRAN（开始）、COMMIT TRAN（提交）、ROLLBACK TRAN（回滚）\n作用：一组操作要么全部生效，要么全部不生效。",
      points: [
        "WHERE 筛行、不能用聚合",
        "HAVING 筛组、能用聚合",
        "三个关键字全写出来"
      ],
      judge: ["WHERE 3 分", "HAVING 3 分", "三关键字 4 分"],
      trap: "只写「WHERE 在前、HAVING 在后」——那是位置不是区别，要说出「筛行 / 筛组」和「能不能用聚合」。",
      memo: "一句话背：<b>筛行用 WHERE，筛组用 HAVING；开、成、撤 = BEGIN / COMMIT / ROLLBACK。</b>"
    }
  }
];

const stage = document.getElementById("stage");
const bar = document.getElementById("bar");
let qi = 0;
let phase = 0; // 0=讲 1=练 2=解析

function esc(s) {
  return String(s).replace(/[&<>]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}
function hl(s) {
  return esc(s)
    .replace(/--[^\n]*/g, (m) => `<span class="cm">${m}</span>`)
    .replace(/\b(SELECT|FROM|WHERE|JOIN|LEFT JOIN|GROUP BY|HAVING|ORDER BY|AS|AND|DESC|ON|UPDATE|SET|DELETE|CASE WHEN|THEN|ELSE|END|BEGIN TRAN|COMMIT TRAN|ROLLBACK TRAN)\b/g, '<span class="kw">$1</span>')
    .replace(/\b(COUNT|SUM|AVG|MAX|MIN|ROW_NUMBER|PARTITION BY|MONTH|YEAR)\b/g, '<span class="fn">$1</span>')
    .replace(/'([^']*)'/g, '<span class="st">\'$1\'</span>');
}

function updateTop() {
  const Q = QS[qi];
  document.getElementById("qn").textContent = qi + 1;
  document.getElementById("qtag").textContent = PARTS[qi];
  const names = ["① 讲知识点", "② 我写一遍", "③ 看解析"];
  document.getElementById("phaseName").textContent = names[phase];
  for (let i = 0; i < 3; i++) {
    const el = document.getElementById("s" + i);
    el.className = i === phase ? "on" : (i < phase ? "done" : "");
  }
  bar.style.width = (((qi * 3 + phase) / (QS.length * 3)) * 100) + "%";
  document.title = `第 ${qi + 1}/10 题 · ${names[phase]}`;
}

function render() {
  const Q = QS[qi];
  updateTop();
  window.scrollTo({ top: 0, behavior: "smooth" });

  if (phase === 0) {
    stage.innerHTML = `
      <div class="card">
        <div class="badge teach">① 知识点 · 第 ${qi + 1} 题 ${Q.key}</div>
        <h2>${Q.teach.title}</h2>
        <p class="lead">${Q.teach.lead}</p>
        <ul class="rules">${Q.teach.rules.map((r) => `<li>${r}</li>`).join("")}</ul>
        <h3>这个形状长这样</h3>
        <pre>${hl(Q.teach.code)}</pre>
        <p class="hint">${Q.teach.note}</p>
        <div class="signals">${Q.teach.signals.map((s) => `<span>题目里出现「<i>${s}</i>」就用它</span>`).join("")}</div>
        <div class="btnrow">
          <button class="go" id="toQuiz">记住了，出题 →</button>
        </div>
      </div>`;
    document.getElementById("toQuiz").onclick = () => { phase = 1; render(); };
    return;
  }

  if (phase === 1) {
    stage.innerHTML = `
      <div class="card">
        <div class="badge quiz">② 你来写 · ${Q.points} 分</div>
        <h2>自己写一遍</h2>
        <p class="stem">${Q.quiz.stem}</p>
        <div class="tags"><span class="tag pt">${Q.points} 分</span><span class="tag">${Q.key}</span><span class="tag">${Q.stars}</span></div>
        <textarea id="tryBox" placeholder="写在纸上为主；想打出来也可以（不打也能直接看解析）"></textarea>
        <p class="hint">提示：先写 FROM / JOIN，再写 WHERE，最后回头补 SELECT——按这个顺序落笔。</p>
        <div class="btnrow">
          <button class="go" id="toAns">我写完了，看解析 →</button>
          <button class="ghost" id="backTeach">回去看知识点</button>
        </div>
      </div>`;
    document.getElementById("toAns").onclick = () => { phase = 2; render(); };
    document.getElementById("backTeach").onclick = () => { phase = 0; render(); };
    return;
  }

  stage.innerHTML = `
    <div class="card">
      <div class="badge ans">③ 解析 · 对一下</div>
      <h2>标准答案</h2>
      <pre>${hl(Q.ans.code)}</pre>
      <h3>逐条讲解</h3>
      <ul class="rules">${Q.ans.points.map((p) => `<li>${p}</li>`).join("")}</ul>
      <div class="judge">${Q.ans.judge.map((j) => `<span>${j}</span>`).join("")}</div>
      <div class="trap"><b>最易踩的坑：</b>${Q.ans.trap}</div>
      <div class="memo"><b>加深印象：</b>${Q.ans.memo}</div>
      <div class="btnrow">
        <button class="go" id="nextQ">${qi === QS.length - 1 ? "看总复习 →" : "下一题 →"}</button>
        <button class="ghost" id="again">这题我再写一遍</button>
      </div>
    </div>`;
  document.getElementById("nextQ").onclick = () => {
    if (qi === QS.length - 1) { qi = QS.length; renderDone(); return; }
    qi += 1; phase = 0; render();
  };
  document.getElementById("again").onclick = () => { phase = 1; render(); };
}

function renderDone() {
  bar.style.width = "100%";
  document.getElementById("phaseName").textContent = "完成";
  ["s0", "s1", "s2"].forEach((id) => { document.getElementById(id).className = "done"; });
  stage.innerHTML = `
    <div class="card done">
      <div class="big">🏁</div>
      <h2>十道题走完了：讲 → 写 → 对</h2>
      <p>明天上场前只看这张顺序表：<br><b>FROM → JOIN → WHERE → GROUP BY → HAVING → SELECT → ORDER BY</b></p>
      <div class="btnrow" style="justify-content:center">
        <button class="go" id="restart">再来一轮</button>
      </div>
      <div class="btnrow" style="justify-content:center">
        <button id="toExam">带解析试卷 /exam</button>
        <button id="toPaper">空白手写卷 /paper</button>
      </div>
      <div class="btnrow" style="justify-content:center">
        <button class="ghost" id="toDrill">默写训练 /drill</button>
        <button class="ghost" id="toM">手机讲义 /m</button>
      </div>
    </div>`;
  document.getElementById("restart").onclick = () => { qi = 0; phase = 0; render(); };
  document.getElementById("toExam").onclick = () => { location.href = "/exam"; };
  document.getElementById("toPaper").onclick = () => { location.href = "/paper"; };
  document.getElementById("toDrill").onclick = () => { location.href = "/drill"; };
  document.getElementById("toM").onclick = () => { location.href = "/m"; };
}

render();
</script>
